<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; width: 320px; background-color: #f8f9fa; }
    h4 { margin-top: 0; color: #1a73e8; }
    input { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #dadce0; border-radius: 4px; }
    input:focus { outline: none; border-color: #1a73e8; }
    button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background: #1557b0; }
  </style>
</head>
<body>
  <h4>Gemini Auto Post</h4>
  <p style="font-size: 13px; color: #5f6368; margin-top: -10px;">Mở gemini.google.com trước khi chạy.</p>
  <input type="text" id="youtubeUrl" placeholder="Nhập link YouTube...">
  <button id="startBtn">Bắt đầu Prompt (Bài + Ảnh)</button>
  <script src="popup.js"></script>
</body>
</html>
